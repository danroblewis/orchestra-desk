[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-desk"
version = "0.1.0"
description = "The Desk for Orchestra: one person's view over the system. A board of standing conditions, checked over the metrics store and served as an instrument, and a ledger of what happened, read from the bus."
requires-python = ">=3.12"
# orchestra: ours is 1.0.0a1; <1.0.0rc0 keeps out the unrelated `orchestra` on PyPI (1.0.0 and up)
dependencies = ["orchestra>=1.0.0a1,<1.0.0rc0", "fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.entry-points."orchestra.plugins"]
desk = "orchestra_desk.plugin:plugin"

[project.entry-points."orchestra.commands"]
desk = "orchestra_desk.cli:main"

[tool.uv]
# This repository's own environment takes Orchestra's main from GitHub (README, "Developing against a
# local Orchestra"). Read only at the root: installed as a dependency, the plugin takes the Orchestra
# it is installed with ([tool.uv.sources] would not do: uv applies a git dependency's sources).
# An override replaces every orchestra requirement, extras too, so it names the dev extra's.
override-dependencies = ["orchestra @ git+https://github.com/danroblewis/orchestra@main"]

[tool.hatch.build.targets.wheel]
packages = ["orchestra_desk"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests"]          # the tests import conftest

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set plus import sorting; where a rule is wrong for one line, that line says why.
extend-select = ["I"]
